name: Lean 4 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean 4 project with Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: true
          build-args: ""
      - name: Verify zero sorry in Lean sources
        run: |
          if grep -rnE "\bsorry\b" --include="*.lean" --exclude-dir=".lake" .; then
            echo "Found sorry in Lean proof!"
            exit 1
          fi
